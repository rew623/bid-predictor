name: 데이터 수집

on:
  schedule:
    - cron: "0 17 * * *"      # 매일 02:00 KST — 전체 수집
    - cron: "0 0,4,8 * * *"   # 09·13·17시 KST — 진행중 공고·최근 낙찰만 빠르게
  workflow_dispatch:
    inputs:
      start_date:
        description: "과거 일괄 수집 시작일 (YYYYMMDD). 비우면 기본값(3년 전)부터"
        required: false
        default: ""
      reset_backfill:
        description: "과거 수집을 오늘부터 처음부터 다시"
        type: boolean
        required: false
        default: false
      quick_only:
        description: "진행중 공고·최근 낙찰만 (몇 분이면 끝남)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install requests

      # 1차: 진행중 공고 + 최근 낙찰 → 바로 커밋해서 앱에 먼저 뜨게 한다
      - name: 빠른 수집 (공고·최근 낙찰)
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          STEPS: "공고,최근낙찰"
          MAX_MINUTES: "40"
        run: python scripts/collect.py

      - name: 빠른 수집 커밋
        if: always()
        run: bash scripts/commit_data.sh "공고"

      # 2차: 과거 낙찰(최근 24개월 먼저) → 개찰 상세 → 나머지 과거
      - name: 전체 수집 (과거 낙찰·개찰 상세)
        if: ${{ github.event.schedule != '0 0,4,8 * * *' && !inputs.quick_only }}
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          START_DATE: ${{ inputs.start_date }}
          RESET_BACKFILL: ${{ inputs.reset_backfill }}
          STEPS: "과거낙찰,상세"
          MAX_MINUTES: "260"
        run: python scripts/collect.py

      - name: 전체 수집 커밋
        if: always()
        run: bash scripts/commit_data.sh "수집"
