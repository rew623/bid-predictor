name: 당첨번호 갱신
on:
  schedule:
    - cron: "10 13 * * 6"   # 토 22:10 KST (추첨 20:35 뒤)
    - cron: "10 23 * * 6"   # 일 08:10 KST (미러가 늦을 때)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update.py
      - name: 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "data: $(date -u +%F) 당첨번호" && git push)
