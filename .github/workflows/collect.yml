name: 데이터 수집

on:
  schedule:
    - cron: "0 17 * * *"      # 매일 02:00 KST — 전체 수집
    - cron: "0 5 * * *"       # 14:00 KST — 전체 수집 한 번 더 (새벽에 조달청 점검·장애로 실패한 날 대비, 남은 한도만 씀)
    - cron: "0 0,4,8 * * *"   # 09·13·17시 KST — 진행중 공고·최근 낙찰만 빠르게
  workflow_dispatch:
    inputs:
      start_date:
        description: "과거 일괄 수집 시작일 (YYYYMMDD). 비우면 기본값(3년 전)부터"
        required: false
        default: ""
      reset_backfill:
        description: "과거 수집을 오늘부터 처음부터 다시"
        type: boolean
        required: false
        default: false
      quick_only:
        description: "진행중 공고·최근 낙찰만 (몇 분이면 끝남)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # 대기열에서 기다린 실행도 최신 데이터에서 시작 (기본값은 예약 시점 커밋 → 옛 데이터로 덮어씀, 2026-09-26 국방 진행 기록이 지워진 일)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install requests numpy

      # 1차: 진행중 공고 + 최근 낙찰 → 바로 커밋해서 앱에 먼저 뜨게 한다
      - name: 빠른 수집 (공고·최근 낙찰)
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          STEPS: "공고,최근낙찰"
          MAX_MINUTES: "40"
          API_DAILY_LIMIT: ${{ vars.API_DAILY_LIMIT || '9500' }}   # 운영계정 승인(2026-09-26). 실제 한도가 더 낮으면 조달청 '요청 제한' 응답에서 그날은 멈춤
        run: python scripts/collect.py

      - name: 추천 모델·역검증 계산
        if: always()
        continue-on-error: true
        run: python scripts/model.py

      - name: 모의 투찰 기록·채점
        if: always()
        continue-on-error: true
        run: python scripts/paper.py

      - name: 빠른 수집 커밋
        if: always()
        run: bash scripts/commit_data.sh "공고"

      # 2차: 과거 낙찰(최근 24개월 먼저) → 개찰 상세 → 나머지 과거
      - name: 전체 수집 (과거 낙찰·개찰 상세)
        if: ${{ github.event.schedule != '0 0,4,8 * * *' && !inputs.quick_only }}
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          START_DATE: ${{ inputs.start_date }}
          RESET_BACKFILL: ${{ inputs.reset_backfill }}
          STEPS: "빈달,업체정보,물품최근,물품과거,지역보강,과거낙찰,상세"
          WATCH_BIZ: ${{ vars.WATCH_BIZ }}
          MAX_MINUTES: "260"
          API_DAILY_LIMIT: ${{ vars.API_DAILY_LIMIT || '9500' }}
        run: python scripts/collect.py

      - name: 추천 모델·역검증 다시 계산
        if: always()
        continue-on-error: true
        run: python scripts/model.py

      - name: 모의 투찰 다시 채점 (개찰 상세 반영)
        if: always()
        continue-on-error: true
        run: python scripts/paper.py

      - name: 업체 색인 (하루 한 번)
        if: always()
        continue-on-error: true
        run: python scripts/corp_index.py

      - name: 전체 수집 커밋
        if: always()
        run: bash scripts/commit_data.sh "수집"

  # 국방전자조달(D2B) 입찰결과 — 나라장터와 서비스·한도가 달라 따로(동시에) 돈다. 서비스키 없이 응답(2026-09-26 확인)
  d2b:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    concurrency:
      group: collect-d2b
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # 대기열에서 기다린 실행도 최신 데이터에서 시작 (기본값은 예약 시점 커밋 → 옛 데이터로 덮어씀, 2026-09-26 국방 진행 기록이 지워진 일)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 국방 입찰결과 수집
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          MAX_MINUTES: "55"
          WATCH_BIZ: ${{ vars.WATCH_BIZ }}
        run: python scripts/collect_d2b.py

      - name: 국방 수집 커밋
        if: always()
        run: bash scripts/commit_data.sh "국방"
